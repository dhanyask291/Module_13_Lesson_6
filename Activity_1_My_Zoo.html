<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Zoo</title>
 <style>
        body{
                font-family: Arial, Helvetica, sans-serif;
                background-color: aliceblue;
                text-align: center;
                padding: 30px;
            }
            h1{
                color: #ff5a43;
            }

            #zoo{
                border: 2px solid #ff5a43;
                width: 300px;
                margin: 16px auto;
                padding: 12px;
                border-radius: 10px;
                text-align: left;

            }

            button{
                background: #ff5a43;
                color: white;
                padding: 10px 24px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
         }
            
     </style>
</head>
<body>
    <h1>My Zoo</h1>
    <p>Use JS and the DOM to add the animals to each cage!</p>
    <!--
    DOM tree- zoo is the parent elemnt mode
    Zone divs are child element nodes.Animal names inside each span are text nodes.
    -->
    <div id="zoo">
        <div class="zone"> Zone 1 <span id="zone1"></span></div>
        <div class="zone"> Zone 2 <span id="zone2"></span></div>
        <div class="zone"> Zone 3 <span id="zone3"></span></div>
        <div class="zone"> Total Animals: <span id="total"></span></div>
    </div>
    <br>

    <button onclick="openZoo()">Open the Zoo!</button>

    <p id="zoo-status"></p>

    <script>
        function openZoo(){
            /* T1:Add first animal to zone 1*/
            document.getElementById('zone1').innerHTML= "Lion";
             /* T2:Add second animal to zone 2*/
            document.getElementById('zone2').innerHTML= "Elephant";
            /* T3:Add third animal to zone 3*/
            document.getElementById('zone3').innerHTML= "Penguin";
            /* T4:Show total animals*/
            document.getElementById("total").innerHTML= "3";
            /* T5:Change zoo background colour*/
            document.getElementById('zoo').style.backgroundColor = "lightgreen";
            /* T6:Use the document object to show page title*/
            document.getElementById('zoo-status').innerHTML= document.title + " is now open!";
        }
    </script>
    
</body>
</html>
